name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 是 README 声明的最低版本。ubuntu-24.04（ubuntu-latest）上
          # setup-python 装不了 3.9，所以这一格固定用 22.04。
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q scripts

      - name: 模块可导入
        run: python .github/check_imports.py

      - name: SKILL.md 必填字段
        run: python .github/check_skill_md.py
